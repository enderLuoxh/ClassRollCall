name: Native Windows
on:
  push:
    branches: [codex/native-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x86 static Release
        run: cmake -S . -B build -A Win32 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Generate real import fixtures
        run: |
          python -m pip install openpyxl==3.1.5 python-docx==1.1.2 xlwt==1.3.0
          python scripts/generate_fixtures.py
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Inspect executable imports
        shell: pwsh
        run: |
          $exe = 'dist/Release/ClassRollCall.exe'
          if (!(Test-Path $exe)) { $exe = 'dist/ClassRollCall.exe' }
          dumpbin /dependents $exe | Tee-Object -FilePath imports.txt
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ClassRollCall-x86-Release
          path: |
            dist/**/ClassRollCall.exe
            imports.txt
            sha256.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            build/licenses/
